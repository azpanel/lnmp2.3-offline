
Download_Mirror='https://soft.lnmp.com'

Nginx_Modules_Options=''
PHP_Modules_Options=''

##MySQL/MariaDB database directory##
MySQL_Data_Dir='/usr/local/mysql/var'
MariaDB_Data_Dir='/usr/local/mariadb/var'
##Default website home directory##
Default_Website_Dir='/home/wwwroot/default'

##Default site security (full LNMP/LNMPA/LAMP installations only)##
##Leave empty to ask; unattended installs default to random and detected IPv4.##
PhpMyAdmin_Mode=${PhpMyAdmin_Mode:-}
Default_Server_IP=${Default_Server_IP:-}
##Basic Auth mode: set username here, supply password via environment or prompt.##
PhpMyAdmin_Auth_User=${PhpMyAdmin_Auth_User:-}

Enable_Nginx_Openssl='y'
Enable_Nginx_Lua='n'
Enable_Ngx_FancyIndex='n'
Enable_Swap='y'
Enable_PHP_Exif='n'
Enable_PHP_Fileinfo='n'
Enable_PHP_Ldap='n'
Enable_PHP_Bz2='n'
Enable_PHP_Sodium='n'
Enable_PHP_Imap='n'

Download_Insecure='n'
Enable_Download_Checksum='y'
